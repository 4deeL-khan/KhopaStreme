<!<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Khopa Stream Player</title>

<style>
body{
    margin:0;
    background:#000;
}
.player{
    width:100%;
    height:100vh;
    border:0;
}
.topbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    padding:10px;
    background:rgba(0,0,0,0.6);
    color:white;
    font-family:Arial;
    font-size:14px;
}
</style>

</head>
<body>

<div class="topbar">
Watch Video Online
</div>

<iframe
class="player"
src="https://player.vimeo.com/video/1199124567"
allow="autoplay; fullscreen; picture-in-picture"
allowfullscreen>
</iframe>

</body>
</html>
